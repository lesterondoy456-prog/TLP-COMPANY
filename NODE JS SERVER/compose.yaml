name: tlp-company
services:
  nodejs-server:
    image: tlp-company-nodejs-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:${API_PORT:-5189}:5189"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5189"
      DB_AUTH: sql
      DB_SERVER: host.docker.internal
      DB_PORT: "${DB_PORT:-1433}"
      DB_NAME: "${DB_NAME:-TLP Company}"
      DB_USER: "${DB_USER:?Set DB_USER in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      ADMIN_NAME: "${ADMIN_NAME:-Lester}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sales-system:
    image: tlp-company-sales-system:local
    build:
      context: ../SalesSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:${SALES_PORT:-5188}:5188"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5189
    depends_on:
      nodejs-server:
        condition: service_healthy
  warehouse-system:
    image: tlp-company-warehouse-system:local
    build:
      context: ../WarehouseSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:${WAREHOUSE_PORT:-5190}:5190"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5189
    depends_on:
      nodejs-server:
        condition: service_healthy
  purchasing-system:
    image: tlp-company-purchasing-system:local
    build:
      context: ../PurchasingSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PURCHASING_PORT:-5191}:5191"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5189
    depends_on:
      nodejs-server:
        condition: service_healthy
  configuration-system:
    image: tlp-company-configuration-system:local
    build:
      context: ../ConfigurationSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:${CONFIGURATION_PORT:-5192}:5192"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5189
    depends_on:
      nodejs-server:
        condition: service_healthy
