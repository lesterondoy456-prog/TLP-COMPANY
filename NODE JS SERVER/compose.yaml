name: tti-company
services:
  nodejs-server:
    image: tti-company-nodejs-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:5188:5188"
    env_file: .env
    environment:
      PORT: "5188"
      DB_SERVER: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sales-system:
    image: tti-company-sales-system:local
    build:
      context: ../SalesSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5189:5189"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  sales-tunnel:
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - type: bind
        source: ${USERPROFILE}/.cloudflared/tti-sales
        target: /etc/cloudflared
        read_only: true
    depends_on:
      sales-system:
        condition: service_healthy
  warehouse-system:
    image: tti-company-warehouse-system:local
    build:
      context: ../WarehouseSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5190:5190"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  purchasing-system:
    image: tti-company-purchasing-system:local
    build:
      context: ../PurchasingSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5191:5191"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  configuration-system:
    image: tti-company-configuration-system:local
    build:
      context: ../ConfigurationSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5192:5192"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  it-ticket-system:
    image: tti-company-it-ticket-system:local
    build:
      context: ../ITTicketSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5193:5193"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  configuration-tunnel:
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - type: bind
        source: ${USERPROFILE}/.cloudflared/tti-configuration
        target: /etc/cloudflared
        read_only: true
    depends_on:
      configuration-system:
        condition: service_healthy
