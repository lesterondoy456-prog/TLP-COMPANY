name: tti-company
services:
  nodejs-server:
    image: tti-company-nodejs-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:5188:5188"
    env_file: .env
    environment:
      PORT: "5188"
      DB_SERVER: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sales-system:
    image: tti-company-sales-system:local
    build:
      context: ../SalesSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5189:5189"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  warehouse-system:
    image: tti-company-warehouse-system:local
    build:
      context: ../WarehouseSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5190:5190"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  purchasing-system:
    image: tti-company-purchasing-system:local
    build:
      context: ../PurchasingSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5191:5191"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
  configuration-system:
    image: tti-company-configuration-system:local
    build:
      context: ../ConfigurationSystem
    restart: unless-stopped
    ports:
      - "0.0.0.0:5192:5192"
    environment:
      API_PROXY_TARGET: http://nodejs-server:5188
    depends_on:
      nodejs-server:
        condition: service_healthy
